<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEV - QR Generator</title>
<style>
  :root { --bg:#111318; --card:#1b1f27; --line:#2c323d; --fg:#f2f4f8; --muted:#9aa3b2;
          --ok:#1f9d55; --err:#c62f3b; --accent:#2f6df6; --dev:#8b5cf6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .devbar { background:var(--dev); color:#fff; font-size:13px; font-weight:700; letter-spacing:1px;
            text-align:center; padding:6px; }
  .devbar a { color:#fff; }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:18px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:14px; line-height:1.5; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; letter-spacing:.5px; }
  input[type=text] { width:100%; padding:15px; font-size:20px; border-radius:12px; border:1px solid var(--line);
          background:var(--card); color:var(--fg); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  button { font-family:inherit; border:0; border-radius:12px; color:#fff; font-weight:700; cursor:pointer; }
  .btn-primary { width:100%; padding:17px; font-size:18px; background:var(--accent); margin-top:12px; }
  .btn-ghost { background:#262c36; padding:12px 14px; font-size:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .row > button { flex:1 1 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:20px; }
  .qrbox { background:#fff; border-radius:12px; padding:14px; display:flex; justify-content:center; }
  canvas { display:block; width:100%; max-width:300px; height:auto; image-rendering:pixelated; }
  .payload { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:22px; font-weight:700;
             letter-spacing:1px; word-break:break-all; margin:14px 0 2px; }
  .meta { color:var(--muted); font-size:13px; line-height:1.6; }
  .verdict { margin-top:12px; border-radius:10px; padding:11px 12px; font-size:14px; font-weight:600; }
  .verdict.ok { background:rgba(31,157,85,.16); color:#5ad07f; border:1px solid rgba(31,157,85,.5); }
  .verdict.err { background:rgba(198,47,59,.16); color:#ff7b86; border:1px solid rgba(198,47,59,.5); }
  .verdict.muted { background:#20252e; color:var(--muted); border:1px solid var(--line); }
  .hide { display:none !important; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip { background:#262c36; border:1px solid var(--line); color:var(--fg); border-radius:999px;
          padding:7px 13px; font-size:13px; font-family:ui-monospace,Menlo,monospace; cursor:pointer; }
  @media print {
    .devbar, .noprint { display:none !important; }
    body { background:#fff; color:#000; }
    .card, .qrbox { border:0; background:#fff; padding:0; }
    canvas { max-width:320px; margin:0 auto; }
  }
</style>
</head>
<body>

<div class="devbar noprint">DEVELOPMENT ONLY &middot; <a href="/dev/scan.html">test scanner</a></div>

<div class="wrap">
  <h1 class="noprint">QR Generator</h1>
  <p class="sub noprint">
    Makes a test QR whose payload is <strong>exactly</strong> the text you type &mdash; no prefix, no URL,
    no JSON. Scan it with <a href="/dev/scan.html" style="color:var(--accent)">the test scanner</a> or the
    real phone scanner at <a href="/" style="color:var(--accent)">/</a>.
  </p>

  <div class="noprint">
    <label for="roll">Roll number</label>
    <input id="roll" type="text" value="B25CS001" placeholder="B25CS001"
           autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="chips" id="chips"></div>
    <button id="go" class="btn-primary">GENERATE QR</button>
  </div>

  <section id="out" class="card hide">
    <div class="qrbox"><canvas id="canvas"></canvas></div>
    <div class="payload" id="payload"></div>
    <div class="meta" id="meta"></div>
    <div id="verify" class="verdict muted">Verifying…</div>
    <div id="dbcheck" class="verdict muted noprint">Not checked against the database yet.</div>
    <div class="row noprint">
      <button id="btnDb" class="btn-ghost">CHECK IN DATABASE</button>
      <button id="btnPng" class="btn-ghost">DOWNLOAD PNG</button>
      <button id="btnPrint" class="btn-ghost">PRINT</button>
    </div>
  </section>
</div>

<script src="/dev/vendor/qrcode.min.js"></script>
<script src="/vendor/jsqr.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var SAMPLES = ['B25CS001', 'B25CS002', 'B25EE010', 'M25MA004'];
  var payload = '';

  SAMPLES.forEach(function (s) {
    var b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = s;
    b.onclick = function () { $('roll').value = s; generate(); };
    $('chips').appendChild(b);
  });

  function verdict(el, kind, html) {
    el.className = 'verdict ' + kind + (el.id === 'dbcheck' ? ' noprint' : '');
    el.innerHTML = html;
  }

  // Draw the QR ourselves (rather than the library's <img>) so the same pixels
  // can be handed straight to jsQR for the round-trip check below.
  function draw(text) {
    var qr = window.qrcode(0, 'M');   // type 0 = auto-size, error correction M
    qr.addData(text);
    qr.make();

    var n = qr.getModuleCount();
    var quiet = 4;                    // quiet zone required by the QR spec
    var cell = 8;
    var side = (n + quiet * 2) * cell;
    var cv = $('canvas');
    cv.width = side; cv.height = side;
    var ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, side, side);
    ctx.fillStyle = '#000';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
      }
    }
    return { modules: n, side: side, ctx: ctx };
  }

  // Decode the canvas we just drew and compare byte for byte. This is the whole
  // point of the page: proof the QR carries the exact string and nothing else.
  function verify(info, text) {
    var el = $('verify');
    try {
      var img = info.ctx.getImageData(0, 0, info.side, info.side);
      var code = window.jsQR(img.data, info.side, info.side, { inversionAttempts: 'dontInvert' });
      if (!code || !code.data) {
        return verdict(el, 'err', 'Could not decode the QR that was just drawn.');
      }
      if (code.data === text) {
        verdict(el, 'ok', '&#10003; Decodes to exactly <code>' + esc(code.data) + '</code> (' +
          code.data.length + ' chars, no prefix).');
      } else {
        verdict(el, 'err', 'Payload mismatch. Encoded <code>' + esc(text) +
          '</code> but decoded <code>' + esc(code.data) + '</code>.');
      }
    } catch (e) {
      verdict(el, 'err', 'Verification failed: ' + esc(e.message));
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }

  function generate() {
    // Only surrounding whitespace is stripped; the payload is otherwise verbatim.
    var text = ($('roll').value || '').trim();
    if (!text) { $('roll').focus(); return; }
    payload = text;

    var info = draw(text);
    $('out').classList.remove('hide');
    $('payload').textContent = text;
    $('meta').innerHTML = 'Payload: <code>' + esc(text) + '</code> &middot; ' + text.length +
      ' characters &middot; QR ' + info.modules + '&times;' + info.modules + ' modules, EC level M';
    verdict($('dbcheck'), 'muted', 'Not checked against the database yet.');
    verify(info, text);
  }

  $('go').onclick = generate;
  $('roll').addEventListener('keydown', function (e) { if (e.key === 'Enter') generate(); });

  // Read-only sanity check: does the distribution server know this roll number?
  $('btnDb').onclick = function () {
    var el = $('dbcheck');
    verdict(el, 'muted', 'Checking…');
    fetch('/api/students/' + encodeURIComponent(payload))
      .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (r) {
        var b = r.body || {};
        if (r.status === 200 && b.student) {
          var s = b.student;
          verdict(el, 'ok', '&#10003; In database: <strong>' + esc(s.rollNo) + '</strong> &middot; size ' +
            esc(s.tshirtSize) + (s.name ? ' &middot; ' + esc(s.name) : '') +
            ' &middot; ' + (s.collected ? 'already collected' : 'not collected yet'));
        } else if (b.status === 'NOT_FOUND') {
          verdict(el, 'err', 'Not in database. The scanner will show STUDENT NOT FOUND. Import a CSV first.');
        } else if (b.status === 'INVALID_ROLL_NO') {
          verdict(el, 'err', 'The server rejects this as a roll number (INVALID_ROLL_NO).');
        } else {
          verdict(el, 'err', 'HTTP ' + r.status + ' &middot; ' + esc(b.error || b.status || 'unknown error'));
        }
      })
      .catch(function (e) { verdict(el, 'err', 'Server unreachable: ' + esc(e.message)); });
  };

  $('btnPng').onclick = function () {
    var a = document.createElement('a');
    a.href = $('canvas').toDataURL('image/png');
    a.download = 'qr-' + payload.replace(/[^A-Za-z0-9._-]/g, '_') + '.png';
    a.click();
  };
  $('btnPrint').onclick = function () { window.print(); };

  generate();
})();
</script>
</body>
</html>
